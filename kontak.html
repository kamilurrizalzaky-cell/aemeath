<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak & Member - Senja Mountain Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="kontak-body">
    <header>
        <div class="logo"><span>Senja Mountain Store</span></div>
        <nav>
            <a href="index.html">Beranda</a>
            <a href="produk.html">Produk</a>
            <a href="kontak.html" class="active">Kontak</a>
        </nav>
    </header>

    <main class="form-main-container">
        <form action="#" method="POST" class="styled-form">
            <h2>Pendaftaran Member Pendaki</h2>
            
            <fieldset>
                <legend>Informasi Pendaki</legend>
                
                <div class="form-group">
                    <label for="nama">Nama Lengkap:</label>
                    <input type="text" id="nama" name="nama" required placeholder="Masukkan nama lengkap">
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required placeholder="pendaki@domain.com">
                </div>

                <div class="form-group">
                    <label for="telp">Nomor Telepon / WA:</label>
                    <input type="tel" id="telp" name="telp" placeholder="08123456789">
                </div>

                <div class="form-group">
                    <label for="password">Password (Minimal 8 karakter):</label>
                    <input type="password" id="password" name="password" minlength="8" required placeholder="••••••••">
                </div>

                <div class="form-group">
                    <label for="tglLahir">Tanggal Lahir:</label>
                    <input type="date" id="tglLahir" name="tglLahir">
                </div>

                <div class="form-group">
                    <label for="kodepos">Kode Pos:</label>
                    <input type="number" id="kodepos" name="kodepos" placeholder="55198">
                </div>

                <div class="form-group">
                    <label for="kota">Kota Asal:</label>
                    <select id="kota" name="kota">
                        <option value="">-- Pilih Kota --</option>
                        <option value="yogyakarta">Yogyakarta</option>
                        <option value="jakarta">Jakarta</option>
                        <option value="bandung">Bandung</option>
                        <option value="surabaya">Surabaya</option>
                        <option value="semarang">Semarang</option>
                    </select>
                </div>

                <div class="form-group radio-group">
                    <label>Jenis Kelamin:</label>
                    <div class="radio-options">
                        <label><input type="radio" name="gender" value="L"> Laki-laki</label>
                        <label><input type="radio" name="gender" value="P"> Perempuan</label>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Pesan & Persetujuan</legend>
                <div class="form-group">
                    <label for="pesan">Pesan / Pertanyaan Alat:</label>
                    <textarea id="pesan" name="pesan" rows="4" placeholder="Tuliskan pertanyaan seputar persewaan/pembelian alat gunung..."></textarea>
                </div>

                <div class="form-group checkbox-group">
                    <label><input type="checkbox" required> Saya menyetujui Syarat & Ketentuan keanggotaan.</label>
                </div>
            </fieldset>

            <button type="submit" class="btn-submit">Kirim Data</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Senja Mountain Store. Hak Cipta Dilindungi Undang-Undang.</p>
    </footer>
</body>
</html>
